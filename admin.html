<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">MATKALIVE<small>ADMIN CONTROL</small> <span class="admin-tag">ADMIN</span></div>
      <nav class="nav">
        <a href="index.html">View User Site</a>
      </nav>

  </header>
  <main id="page">
    <section class="page-head">
      <h1>Admin Panel</h1>
      <p>Sign in with an administrator account.</p>
    </section>
    <form class="card form" id="admin-login">
      <label>Username <input name="username" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Sign In</button>
      <p class="form-hint">Demo admin: <code>admin / 112233</code></p>
    </form>
  </main>
  <footer class="site-foot">
    <strong>MatkaLive Admin</strong> — restricted area. No real-money gambling, betting or wagering is offered or facilitated.
  </footer>
  <script src="js/data.js?v=5"></script>
  <script src="js/api.js?v=5"></script>

</body>
