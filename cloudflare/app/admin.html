</head>
<body>
<script>
(function () {
  function boom(msg, src) {
    if (document.getElementById("boot-err")) return;
    var d = document.createElement("div");
    d.id = "boot-err";
    d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#1a120b;color:#ff5f5f;font:600 13px/1.5 monospace;padding:20px;white-space:pre-wrap;overflow:auto";
    d.textContent = "MATKALIVE LOAD ERROR\n\n" + msg + "\n\n(from " + src + ")\n\nReload: Cmd+Shift+R";
    document.body.appendChild(d);
  }
  window.addEventListener("error", function (e) {
    boom((e.message || "script error") + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    boom("Unhandled promise rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason || e));
  });
})();
</script>
<script>
(function () {
  try {
    var t = localStorage.getItem("matka.theme");
    var theme = (t === "light" || t === "night") ? t : "dark";
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">MATKALIVE<small>ADMIN CONTROL</small> <span class="admin-tag">ADMIN</span></div>
      <nav class="nav">
        <a href="index.html">View User Site</a>
        <button class="theme-toggle" id="theme-toggle" title="Theme: dark / light / night" aria-label="Toggle theme (dark / light / night)">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-night" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>

  <main id="page">

      <label>Username <input name="username" required autocomplete="username"></label>

    </form>

  <script src="js/sync.js?v=34"></script>

  <script src="js/api.js?v=34"></script>
  <script src="js/admin-app.js?v=37"></script>
  <script>
  (function () {
    var toggle = document.getElementById("theme-toggle");
    if (!toggle) return;
    var THEMES = ["dark", "light", "night"];
    function apply(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      for (var i = 0; i < THEMES.length; i++) toggle.classList.toggle("t-" + THEMES[i], THEMES[i] === theme);
      try { localStorage.setItem("matka.theme", theme); } catch (e) {}
    }
    function current() {
      var t = document.documentElement.getAttribute("data-theme");
      return THEMES.indexOf(t) >= 0 ? t : "dark";
    }
    toggle.addEventListener("click", function () {
      var idx = (THEMES.indexOf(current()) + 1) % THEMES.length;
      apply(THEMES[idx]);
    });
    apply(current());
  })();
  </script>
</body>
</html>
