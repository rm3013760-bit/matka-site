<script>
(function () {
  function boom(msg, src) {
    if (document.getElementById("boot-err")) return;
    var d = document.createElement("div");
    d.id = "boot-err";
    d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#1a120b;color:#ff5f5f;font:600 13px/1.5 monospace;padding:20px;white-space:pre-wrap;overflow:auto";
    d.textContent = "MATKALIVE LOAD ERROR\n\n" + msg + "\n\n(from " + src + ")\n\nReload: Cmd+Shift+R";
    document.body.appendChild(d);
  }
  window.addEventListener("error", function (e) {
    boom((e.message || "script error") + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    boom("Unhandled promise rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason || e));
  });
})();
</script>
<script>
(function () {

  <script>
  (function () {
    var toggle = document.getElementById("theme-toggle");
    if (!toggle) return;
    function apply(theme) {
      var light = theme === "light";
      document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      toggle.classList.toggle("on", light);
    }
    toggle.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      try { localStorage.setItem("matka.theme", cur); } catch (e) {}
      apply(cur);
    });
    apply(document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");
  })();
  </script>
