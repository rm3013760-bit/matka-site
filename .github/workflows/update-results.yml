name: update-results

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-results
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Continuous fetch loop (refreshes ~every 30s, ~4.2h per run)
        run: |
          chmod +x server/actions/updater.sh
          DEADLINE=$((SECONDS + 252*60))   # 4h12m of fetching
          while [ $SECONDS -lt $DEADLINE ]; do
            ./server/actions/updater.sh || true
            sleep 30
          done
        env:
          TZ: Asia/Kolkata
      - name: Re-arm self-perpetuating chain (start next run)
        run: |
          for i in 1 2 3; do
            gh api -X POST repos/${{ github.repository }}/actions/workflows/update-results.yml/dispatches \
              -f ref="${{ github.ref_name }}" || true
            sleep 2
          done
        env:
          GH_TOKEN: ${{ github.token }}
