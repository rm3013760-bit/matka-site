name: update-results

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch loop (30s interval)
        run: |
          git config user.name "results-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$((SECONDS + 240))
          while [ $SECONDS -lt $end ]; do
            node server/fetch-results.js --to-file live_results.json || true
            if ! git diff --quiet; then
              git add live_results.json
              git commit -m "auto: results $(TZ=Asia/Kolkata date +%H:%M:%S)"
              git push || true
            fi
            sleep 30
          done
