name: update-results

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-results
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run self-healing updater (retries until fresh)
        run: |
          chmod +x server/actions/updater.sh
          ./server/actions/updater.sh
        env:
          TZ: Asia/Kolkata
      - name: Re-arm self-perpetuating chain (re-dispatch)
        run: |
          sleep 5
          gh api -X POST repos/${{ github.repository }}/actions/workflows/update-results.yml/dispatches \
            -f ref="${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
